workflows:
  ios-pip-camera:
    name: PIP Camera iOS
    max_build_duration: 30
    instance_type: mac_mini_m2

environment:
  xcode: latest
scripts:
  - name: Install XcodeGen
    script: |
      brew install xcodegen
  - name: Generate Xcode project
    script: |
      xcodegen generate
  - name: Build iOS app
    script: |
      xcodebuild \
        -project PIPCamera.xcodeproj \
        -scheme PIPCamera \
        -sdk iphoneos \
        -configuration Debug \
        CODE_SIGNING_ALLOWED=NO \
        build
artifacts:
  - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/PIPCamera.app
